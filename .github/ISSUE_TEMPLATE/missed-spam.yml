name: Missed Spam Report
description: Report a suspicious case that GET OUT SPAM did not detect.
title: "[Missed spam]: "
labels:
  - missed-spam
body:
  - type: markdown
    attributes:
      value: |
        Share only public GitHub issue, pull request, or comment URLs.
        Do not post private repository content, personal contact information, tokens, secret keys, or full private conversations.
  - type: input
    id: url
    attributes:
      label: Public GitHub URL
      description: Paste the issue, pull request, or comment permalink.
      placeholder: https://github.com/owner/repo/issues/123#issuecomment-1234567890
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why It Looks Suspicious
      description: Describe the public signals you observed.
      placeholder: For example, the account repeatedly asked maintainers to move to an external messenger.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Review Hint
      description: Describe what risk hint or wording would have been more helpful.
    validations:
      required: false
